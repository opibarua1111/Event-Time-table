<div class="timetable-container">
  <!-- Day Tabs -->
  <div class="tabs-container">
    <mat-tab-group 
      [selectedIndex]="getSelectedTabIndex()"
      (selectedIndexChange)="onTabChange($event)"
      class="day-tabs"
      mat-stretch-tabs="false">
      <mat-tab *ngFor="let day of weekDays">
        <ng-template mat-tab-label>
          <div class="tab-label">
            <div class="day-name">{{ day.dayName }}</div>
            <div class="day-date">Date: {{ day.displayDate }}</div>
          </div>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </div>

  <div class="selection-toolbar" *ngIf="getSelectedEventsCount() > 0">
    <div class="selection-info">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/>
      </svg>
      <span class="selection-count">{{ getSelectedEventsCount() }} event(s) selected</span>
    </div>
    <div class="toolbar-actions">
      <button class="delete-selection-btn" (click)="deleteSelectedEvents()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/>
        </svg>
        Delete
      </button>
      <button class="clear-selection-btn" (click)="clearSelection()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="currentColor"/>
        </svg>
        Clear Selection
      </button>
    </div>
  </div>

  <!-- Timetable -->
  <div class="timetable-grid-wrapper">
    <!-- Time Column-->
    <div class="time-column">
      <div class="venue-header-spacer"></div>
      <div class="time-slots-container" #timeSlotContainer>
        <div 
          *ngFor="let time of timeSlots" 
          class="time-slot"
          [style.height.px]="TIME_SLOT_HEIGHT">
          {{ time }}
        </div>
      </div>
    </div>

    <div class="scrollable-content" #scrollableContent (scroll)="onScroll($event)">
      <div class="content-inner">
        <!-- Venue Headers -->
        <div class="venue-headers-wrapper">
          <div class="venue-headers">
            <div 
              *ngFor="let venue of venues" 
              class="venue-header"
              [style.width.px]="VENUE_WIDTH">
              {{ venue.name }}
            </div>
          </div>
        </div>

        <!-- Events -->
        <div class="events-container">
          <div class="events-grid" [style.height]="getGridHeight()">
            <div 
              *ngFor="let venue of venues" 
              class="venue-column"
              [style.width.px]="VENUE_WIDTH">
              
              <div class="time-grid">
                <div 
                  *ngFor="let time of timeSlots" 
                  class="grid-line"
                  [style.height.px]="TIME_SLOT_HEIGHT">
                </div>
              </div>

              <div class="events-wrapper">
                <div 
                  *ngFor="let event of getEventsForVenue(venue.id)"
                  class="event-card"
                  [class.selected]="isEventSelected(event)"
                  [ngStyle]="getEventStyle(event)"
                  (click)="toggleEventSelection(event)">
                  <div class="event-content">
                    <div class="event-time">{{ event.startTime }} - {{ event.endTime }}</div>
                    <div class="event-title">{{ event.title }}</div>
                  </div>
                  <div class="selection-indicator" *ngIf="isEventSelected(event)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="white"/>
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<button mat-fab class="fab-button" (click)="openCreateEventDialog()" 
        matTooltip="Create New Event" 
        matTooltipPosition="left"
        aria-label="Create new event">
  <mat-icon>add</mat-icon>
</button>
